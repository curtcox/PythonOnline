<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="640" height="480" fill="#f2f7f5"/><text x="32" y="38" font-family="monospace" font-size="13" fill="#167c80">PYTHON ONLINE · A function from 256t</text><text x="32" y="78" font-family="monospace" font-size="15" fill="#34515a">HELLO names: &#39;lambda name: f&quot;Hello, {name}!&quot;&#39;</text><text x="32" y="102" font-family="monospace" font-size="15" fill="#34515a">  Hello, Ada!</text><text x="32" y="126" font-family="monospace" font-size="15" fill="#34515a">  Hello, Grace!</text><text x="32" y="150" font-family="monospace" font-size="15" fill="#34515a">  Hello, Guido!</text><text x="32" y="174" font-family="monospace" font-size="15" fill="#34515a">HYPOTENUSE names: &#39;import math\ndef hyp(a, b):\n    return math.h</text><text x="32" y="198" font-family="monospace" font-size="15" fill="#34515a">  hypotenuse(3, 4) = 5.0</text><text x="32" y="222" font-family="monospace" font-size="15" fill="#34515a">  hypotenuse(5, 12) = 13.0</text><text x="32" y="246" font-family="monospace" font-size="15" fill="#34515a">  hypotenuse(8, 15) = 17.0</text></svg>
