<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480"><rect width="640" height="480" fill="#f2f7f5"/><text x="32" y="38" font-family="monospace" font-size="13" fill="#167c80">PYTHON ONLINE · microgpt: a tiny transformer</text><text x="32" y="78" font-family="monospace" font-size="15" fill="#34515a">microgpt: 20 names, 11 tokens, 1008 parameters</text><text x="32" y="102" font-family="monospace" font-size="15" fill="#34515a">Training a one-layer, 2-head transformer for 60 steps.</text><text x="32" y="126" font-family="monospace" font-size="15" fill="#34515a">Step  20: mean loss 2.011</text><text x="32" y="150" font-family="monospace" font-size="15" fill="#34515a">Step  40: mean loss 1.492</text><text x="32" y="174" font-family="monospace" font-size="15" fill="#34515a">Step  60: mean loss 1.243</text><text x="32" y="198" font-family="monospace" font-size="15" fill="#34515a">Generated names (a short training demo, so expect babble):</text><text x="32" y="222" font-family="monospace" font-size="15" fill="#34515a">  iva</text><text x="32" y="246" font-family="monospace" font-size="15" fill="#34515a">  lliy</text><text x="32" y="270" font-family="monospace" font-size="15" fill="#34515a">  eva</text><text x="32" y="294" font-family="monospace" font-size="15" fill="#34515a">  anna</text><text x="32" y="318" font-family="monospace" font-size="15" fill="#34515a">  eila</text><text x="32" y="342" font-family="monospace" font-size="15" fill="#34515a">  ella</text><text x="32" y="366" font-family="monospace" font-size="15" fill="#34515a">  looia</text><text x="32" y="390" font-family="monospace" font-size="15" fill="#34515a">  a</text></svg>
