name: Test Python Online
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
    inputs:
      hosted_only:
        description: Run focused hosted-storage browser checks
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/test.yml@v2
    with:
      pre-test: python3 -m unittest discover -s tests && TEST_PACKAGES=1 npm test
      kit-path: vendor/fragment-kit-v0.4.1
      contract-config: testing-contract.config.mjs
      server-command: PORT=8000 node tests/browser/server.cjs
      browser-command: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.hosted_only == 'true' && 'HOSTED_ONLY=1 node tests/browser/all.cjs' || 'node tests/browser/recovery-hosting.cjs && node tests/browser/ai.cjs && FULL_GALLERY=1 npm run test:browser' }}
  kit:
    uses: curtcox/Tools-for-pages-with-state-in-URL-fragments/.github/workflows/kit-check.yml@v2
    with:
      kit-path: vendor/fragment-kit-v0.4.1
